services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
      POSTGRES_DB: prestei_chatbot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:17
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    volumes:
      - ./docker/postgres/ensure-databases.sh:/ensure-databases.sh:ro
    entrypoint: ["/bin/bash", "/ensure-databases.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-1234}@postgres:5432/prestei_chatbot_db
      EVOLUTION_API_URL: http://api-evolution:8080
      WEBHOOK_URL: http://backend:3001/webhook/evolution
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    command: sh /entrypoint.sh
    depends_on:
      db-init:
        condition: service_completed_successfully

  api-evolution:
    build: ./api-evolution
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DOCKER_ENV: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD:-1234}@postgres:5432/evolution_db
    volumes:
      - ./api-evolution:/app
      - /app/node_modules
      - ./docker/api-evolution/entrypoint.sh:/entrypoint.sh:ro
    command: sh /entrypoint.sh
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

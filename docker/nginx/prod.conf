# Frontend — prestei.com / www.prestei.com
server {
    listen 443 ssl http2;
    server_name prestei.com www.prestei.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/prestei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prestei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Backend — api.prestei.com
server {
    listen 443 ssl http2;
    server_name api.prestei.com;

    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/prestei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prestei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Evolution API — evolution.prestei.com
server {
    listen 443 ssl http2;
    server_name evolution.prestei.com;

    location / {
        proxy_pass http://api-evolution:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    ssl_certificate /etc/letsencrypt/live/prestei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prestei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Healthcheck interno (sem log)
server {
    listen 8088;
    server_name _;
    location /nginx-health {
        access_log off;
        return 200 'ok';
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name prestei.com www.prestei.com api.prestei.com evolution.prestei.com;
    return 301 https://$host$request_uri;
}
